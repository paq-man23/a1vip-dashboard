<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password · A1 VIP</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);padding:28px;border:1px solid #334155;border-radius:18px;background:#111827}h1{font-size:24px;margin-top:0}p{color:#cbd5e1;line-height:1.5}label{display:block;margin:18px 0 8px}input{display:block;width:100%;padding:12px;background:#0b1220;border:1px solid #64748b;border-radius:8px;color:white;font:inherit}button{width:100%;padding:12px;margin-top:20px;background:#22d3ee;color:#0b1220;border:0;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:#67e8f9}#message{min-height:40px}
  </style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p>Use the secure reset link sent to your email to update your A1 VIP password.</p>
  <form id="resetForm">
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" required minlength="8" disabled>
    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" disabled>
    <button id="savePassword" type="submit" disabled>Save Password</button>
  </form>
  <p id="message" role="status" aria-live="polite">Checking your reset link…</p>
  <a href="./">Return to login</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.1/dist/umd/supabase.js"></script>
<script src="./supabase-config.js"></script>
<script>
(() => {
  const message = document.getElementById('message');
  const password = document.getElementById('password');
  const confirmation = document.getElementById('confirmPassword');
  const button = document.getElementById('savePassword');
  let client, recoveryReady = false, busy = false;
  const lock = locked => { password.disabled = locked; confirmation.disabled = locked; button.disabled = locked; };
  try {
    const config = window.A1_SUPABASE_CONFIG;
    if (!config?.url || !config.publishableKey || !window.supabase) throw new Error('Password reset is not configured.');
    client = window.supabase.createClient(config.url, config.publishableKey);
    client.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Leave the Auth callback before requesting user data to avoid deadlocks.
        setTimeout(async () => {
          try {
            const { data, error } = await client.auth.getUser();
            if (error || !data.user) throw new Error('This link has expired. Request a new reset link from the login page.');
            recoveryReady = true; lock(false); message.textContent = 'Your reset link is valid. Enter a new password.';
          } catch(error) { message.textContent = error.message; }
        }, 0);
      } else if (event === 'INITIAL_SESSION' && !recoveryReady) {
        message.textContent = 'Open the reset link from your email. If it expired, request a new one from the login page.';
      } else if (event === 'SIGNED_OUT') { recoveryReady = false; lock(true); }
    });
  } catch(error) { message.textContent = error.message; }
  document.getElementById('resetForm').addEventListener('submit', async event => {
    event.preventDefault();
    if (!recoveryReady || busy) return;
    if (password.value !== confirmation.value) { message.textContent = 'The passwords do not match.'; return; }
    busy = true; lock(true); message.textContent = 'Saving your password…';
    try {
      const { error } = await client.auth.updateUser({ password: password.value });
      if (error) throw error;
      password.value = ''; confirmation.value = '';
      recoveryReady = false;
      const { error: signOutError } = await client.auth.signOut({ scope: 'local' });
      message.textContent = signOutError ? 'Password updated. Close this page and return to login.' : 'Password updated. Return to login and sign in with your new password.';
    } catch(error) { message.textContent = error.message; lock(!recoveryReady); }
    finally { busy = false; }
  });
})();
</script>
</body>
</html>
